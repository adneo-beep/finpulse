<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아파트 매매 가격변동율 · 시군구 세부</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      font-size: 12px;
      background: #f0f4f8;
      color: #222;
    }
    .page-header {
      background: #1a3a6b;
      color: #fff;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h1 { font-size: 16px; font-weight: bold; }
    .page-header .nav-links { display: flex; gap: 10px; align-items: center; }
    .page-header a {
      color: #aac8ff;
      font-size: 11px;
      text-decoration: none;
      border: 1px solid #aac8ff;
      padding: 3px 10px;
      border-radius: 3px;
    }
    .page-header .meta { font-size: 11px; opacity: .75; }

    #loading {
      padding: 60px 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #ccc;
      border-top-color: #1a3a6b;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error { display:none; padding:20px; color:#c00; }

    .table-wrap {
      overflow-x: auto;
      padding: 12px 16px 30px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 780px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    th, td {
      border: 1px solid #d4d8e0;
      padding: 4px 7px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }
    /* 헤더 */
    thead th {
      background: #1a3a6b;
      color: #fff;
      font-size: 11px;
      padding: 6px 8px;
    }
    thead th.week-th {
      background: #2a5298;
      min-width: 66px;
    }
    .week-date { font-size: 10px; font-weight: normal; opacity: .8; }

    /* 지역 행 */
    td.region-name {
      text-align: left;
      font-size: 12px;
    }
    /* 레벨별 스타일 */
    tr.lv0 td { background: #1a3a6b; color: #fff; font-weight: bold; }
    tr.lv0 td.region-name { padding-left: 6px; }

    tr.lv1 td { background: #eef2f8; font-weight: bold; }
    tr.lv1 td.region-name { padding-left: 8px; font-size: 12px; }
    tr.lv1 { border-top: 2px solid #8899cc !important; }

    tr.lv2 td { background: #fff; }
    tr.lv2 td.region-name { padding-left: 20px; font-size: 11px; color: #333; }

    tr.lv3 td { background: #fafafa; }
    tr.lv3 td.region-name { padding-left: 36px; font-size: 11px; color: #555; }

    /* 값 색상 */
    .pos { color: #cc0000; }
    .neg { color: #0055cc; }
    .zero { color: #555; }
    .na { color: #bbb; }

    /* 지수변동 */
    td.val { font-size: 11px; min-width: 60px; }
    td.val.lv1-val { font-weight: bold; font-size: 12px; }

    /* 전주비 */
    td.chg { font-size: 11px; min-width: 54px; }
    td.chg.lv1-val { font-weight: bold; }

    /* 주차 컬럼 */
    td.wk { font-size: 11px; min-width: 62px; }

    /* 열 너비 */
    .col-region { min-width: 110px; text-align: left !important; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>📊 아파트 매매 가격변동율 · 시군구 세부</h1>
  <div class="nav-links">
    <a href="housing-table.html">← 주택시장 동향</a>
    <span class="meta" id="header-meta">기준일: 조회 중…</span>
  </div>
</div>

<div id="loading"><span class="spinner"></span>시군구 데이터 조회 중… (약 30~60초 소요)</div>
<div id="error"></div>

<div class="table-wrap" style="display:none" id="table-wrap">
  <table>
    <thead>
      <tr id="header-row">
        <th class="col-region">지역</th>
        <th style="min-width:62px">지수/변동율</th>
        <th style="min-width:54px">전주비</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
function fmtRate(v, bold) {
  if (v == null) return { text: '―', cls: 'na' };
  const n = Number(v);
  if (isNaN(n)) return { text: '―', cls: 'na' };
  const s = (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cls = n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero';
  return { text: s, cls };
}

function fmtChg(v) {
  if (v == null) return { text: '', cls: 'na' };
  const n = Number(v);
  if (isNaN(n)) return { text: '', cls: 'na' };
  if (n > 0) return { text: '+' + n.toFixed(2) + '%', cls: 'pos' };
  if (n < 0) return { text: '△' + Math.abs(n).toFixed(2) + '%', cls: 'neg' };
  return { text: '―', cls: 'zero' };
}

async function loadData() {
  const r = await fetch('/api/apartment/price-detail');
  const json = await r.json();
  if (!json.success) throw new Error(json.error || '데이터 오류');
  return json;
}

function render(json) {
  const { weeks, weekDates, data } = json;

  // 헤더 날짜
  document.getElementById('header-meta').textContent =
    `기준일: ${weekDates[weekDates.length - 1]} (${weeks[weeks.length - 1]})`;

  // 주차 컬럼 헤더 추가
  const headerRow = document.getElementById('header-row');
  weeks.forEach((w, i) => {
    const th = document.createElement('th');
    th.className = 'week-th';
    th.innerHTML = w + (weekDates[i] ? `<br><span class="week-date">${weekDates[i]}</span>` : '');
    headerRow.appendChild(th);
  });

  const tbody = document.getElementById('tbody');

  data.forEach(row => {
    const tr = document.createElement('tr');
    tr.className = `lv${row.level}`;

    // 지역명
    const tdName = document.createElement('td');
    tdName.className = 'region-name col-region';
    tdName.textContent = row.name;
    tr.appendChild(tdName);

    const isBold = row.level <= 1;

    // 지수/변동율 (최신주)
    const { text: valText, cls: valCls } = fmtRate(row.value);
    const tdVal = document.createElement('td');
    tdVal.className = `val ${valCls}` + (isBold ? ' lv1-val' : '');
    tdVal.textContent = valText;
    tr.appendChild(tdVal);

    // 전주비
    const { text: chgText, cls: chgCls } = fmtChg(row.change);
    const tdChg = document.createElement('td');
    tdChg.className = `chg ${chgCls}` + (isBold ? ' lv1-val' : '');
    tdChg.textContent = chgText;
    tr.appendChild(tdChg);

    // 주차별 변동율 (4주)
    (row.trend || []).forEach(v => {
      const { text, cls } = fmtRate(v);
      const td = document.createElement('td');
      td.className = `wk ${cls}`;
      td.textContent = text;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('table-wrap').style.display = '';
}

(async () => {
  try {
    const json = await loadData();
    render(json);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.style.display = '';
    el.textContent = '오류: ' + e.message;
  }
})();
</script>
</body>
</html>
