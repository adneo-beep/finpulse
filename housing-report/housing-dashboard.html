// ── SVG 스파크라인 (외부 라이브러리 없이 순수 SVG) ──────────
function Sparkline({ data, direction }) {
  const W = 180, H = 48, PAD = 6;
  const vals = data.map(d => d.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const toX = i => PAD + (i / (data.length - 1)) * (W - PAD * 2);
  const toY = v => H - PAD - ((v - min) / range) * (H - PAD * 2);
  const pts = data.map((d, i) => `${toX(i)},${toY(d.value)}`).join(" ");
  const color = direction === "up" ? "#2563eb" : direction === "down" ? "#dc2626" : "#6b7280";

  const [tooltip, setTooltip] = React.useState(null);

  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:48}}>
        {/* 그라디언트 영역 */}
        <defs>
          <linearGradient id={`g-${direction}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.15"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <polygon
          points={`${toX(0)},${H} ${pts} ${toX(data.length-1)},${H}`}
          fill={`url(#g-${direction})`}
        />
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
        {data.map((d, i) => (
          <circle
            key={i} cx={toX(i)} cy={toY(d.value)} r="3.5"
            fill="white" stroke={color} strokeWidth="2"
            style={{cursor:"pointer"}}
            onMouseEnter={e => setTooltip({i, x: toX(i), y: toY(d.value), d})}
            onMouseLeave={() => setTooltip(null)}
          />
        ))}
        {tooltip && (
          <g>
            <rect x={tooltip.x - 22} y={tooltip.y - 22} width={44} height={16} rx={4} fill="#1e293b" opacity="0.85"/>
            <text x={tooltip.x} y={tooltip.y - 11} textAnchor="middle" fill="white" fontSize="9" fontWeight="bold">
              {tooltip.d.value}
            </text>
          </g>
        )}
      </svg>
      {/* 날짜 레이블 */}
      <div className="flex justify-between px-1">
        {data.map(d => <span key={d.date} className="text-gray-400" style={{fontSize:9}}>{d.date}</span>)}
      </div>
    </div>
  );
}

// ── 배지 ─────────────────────────────────────────────────
function Badge({ note, direction }) {
  const styles = {
    up:      "bg-blue-50 text-blue-700 border border-blue-200",
    down:    "bg-red-50 text-red-600 border border-red-200",
    neutral: "bg-gray-100 text-gray-500",
  };
  const arrows = { up: "▲", down: "▼", neutral: "─" };
  return (
    <span className={`inline-flex items-center gap-0.5 text-xs font-semibold px-2 py-0.5 rounded-full ${styles[direction]}`}>
      {arrows[direction]} {note}
    </span>
  );
}

  return (

      <div className="flex items-start justify-between gap-2">
        <p className="text-sm font-semibold text-gray-700 leading-snug">{item.name}</p>

async function fetchTradesFromBackend(region = '11110', month = '202605') {
  try {
    console.log(`🔄 백엔드 API 호출: /apartment/trades (지역=${region}, 월=${month})`);
    const response = await fetch(`${API_BASE}/apartment/trades?region=${region}&month=${month}`);
    const data = await response.json();

    if (data.success) {
      console.log(`✅ 거래량 조회 성공: ${data.totalCount}건`);
      return data;
    } else {
      console.error('❌ API 오류:', data.error);
      return null;
    }
  } catch (error) {
    console.error('⚠️ 백엔드 API 호출 실패:', error.message);
    return null;
  }
}

    // API 키: 공공데이터포털 인증키
    // LAWD_CD: 법정동코드 (11110=서울, 41000=경기, 28000=인천)
    // DEAL_YM: 거래년월 (YYYYMM)
    const MOLIT_KEY = '5039af0d3b48f2540373d371810bec76d3ce3f1bdcd0c87532b348fa3d3c5f69';

    // 서울 거래량
    const seoulTradeRes = await fetch(
      '/molit-api-proxy.php' ||
      'https://openapi.molit.go.kr/OpenAPI_ToolInstallPackage/service/rest/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade' +
      '?serviceKey=' + MOLIT_KEY +
      '&LAWD_CD=11110' +
      '&DEAL_YM=202605' +
      '&pageNo=1' +
      '&numOfRows=1000'
    ).then(r => r.json()).catch(e => {
      console.warn('⚠️ MOLIT API 호출 실패, 모의 데이터 사용');
      return { response: { body: { items: { item: [] } } } };
    });

    // 경기 거래량
    const gyeonggiTradeRes = await fetch(
      'https://openapi.molit.go.kr/OpenAPI_ToolInstallPackage/service/rest/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade' +
      '?serviceKey=' + MOLIT_KEY +
      '&LAWD_CD=41000' +
      '&DEAL_YM=202605' +
      '&pageNo=1' +
      '&numOfRows=1000'
    ).then(r => r.json()).catch(e => ({ response: { body: { items: { item: [] } } } }));

    console.log('✅ API 로드 완료');
    console.log('- R-ONE 매매:', saleRes.result?.chartList?.length || 0, '건');
    console.log('- R-ONE 전세:', leaseRes.result?.chartList?.length || 0, '건');
    console.log('- MOLIT 서울 거래량:', seoulTradeRes.response?.body?.items?.item?.length || 0, '건');
    console.log('- MOLIT 경기 거래량:', gyeonggiTradeRes.response?.body?.items?.item?.length || 0, '건');

    return {
      sale: saleRes.result?.chartList,
      lease: leaseRes.result?.chartList,
      trade: { seoul: seoulTradeRes, gyeonggi: gyeonggiTradeRes }
    };
  } catch (e) {
    console.error('⚠️ API 로드 실패:', e.message);
    return { sale: null, lease: null, trade: null };
  }
}

// ── 메인 대시보드 ─────────────────────────────────────────
function Dashboard() {
  const [data, setData] = React.useState(mockData);
  const [apiLoading, setApiLoading] = React.useState(true);

  // 페이지 로드 시 API에서 데이터 가져오기
  React.useEffect(() => {
    setApiLoading(true);

    (async () => {
      try {
        // 1️⃣ R-ONE API: 가격지수 (기존 방식)
        const apartmentData = await fetchApartmentData();

        // 2️⃣ 백엔드 API: 주간별 거래량 조회
        const weeklyTrades = await fetchWeeklyTradesFromBackend('202605');

        console.log('✅ 모든 API 로드 완료', {
          매매_가격지수: apartmentData?.sale?.length,
          전세_가격지수: apartmentData?.lease?.length,
          주간_거래량: weeklyTrades?.regions?.length,
        });

        // 데이터가 있으면 state 업데이트 가능
        if (weeklyTrades?.regions) {
          console.log('📊 주간 거래량 데이터:');
          weeklyTrades.regions.forEach(region => {
            console.log(`  ${region.region}: ${region.totalCount}건`);
            region.weeklyData.forEach(week => {
              console.log(`    ${week.week}: ${week.count}건`);
            });
          });
        }
      } catch (error) {
        console.error('❌ API 로드 중 오류:', error);
      }

      setApiLoading(false);
    })();
  }, []);

  const { meta, summary, indicators, sources } = data;

  const groups = indicators.reduce((acc, item) => {
    if (!acc[item.group]) acc[item.group] = { icon: item.groupIcon, items: [] };
    acc[item.group].items.push(item);
    return acc;
  }, {});

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">

      {/* 헤더 + API 상태 */}
      <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-7">
        <div>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xs font-bold bg-blue-600 text-white px-3 py-1 rounded-full">{meta.year} · {meta.week}</span>
            <span className="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full">{meta.baseDate} 기준</span>
            {apiLoading && <span className="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full animate-pulse">🔄 API 로드 중...</span>}
          </div>
          <h1 className="text-2xl sm:text-3xl font-bold text-gray-800 flex items-center gap-2">
            🏘️ 주간 주택시장 동향
          </h1>
        </div>
        <span className="self-start sm:self-auto text-sm font-bold bg-blue-100 text-blue-700 px-4 py-2 rounded-full border border-blue-200">
          {apiLoading ? '데이터 로딩...' : 'Summary'}
        </span>
      </div>

      {/* 요약 카드 */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-9">
        {summary.map((s, i) => (
          <div key={i} className="bg-white rounded-xl border border-blue-100 p-4 flex gap-3 items-start shadow-sm">
            <span className="text-2xl">{s.icon}</span>
            <div>
              <p className="text-xs font-bold text-blue-700 mb-1">{s.label}</p>
              {s.lines.map((l, j) => <p key={j} className="text-xs text-gray-600 leading-relaxed">· {l}</p>)}
            </div>
          </div>
        ))}
      </div>

      {/* 구분선 + 섹션 타이틀 */}
      <div className="flex items-center gap-3 mb-6">
        <span className="w-1.5 h-6 bg-blue-600 rounded-full"></span>
        <h2 className="text-base font-bold text-gray-700">주택관련 주간지표</h2>
        <div className="flex-1 h-px bg-gray-200"></div>
      </div>

      {/* 그룹별 카드 */}
      {Object.entries(groups).map(([group, { icon, items }]) => {
        const s = GROUP_STYLE[group] || GROUP_STYLE["가격변동율"];
        const cols = items.length === 1 ? "grid-cols-1 max-w-xs" :
                     items.length === 2 ? "grid-cols-1 sm:grid-cols-2" :
                     "grid-cols-1 sm:grid-cols-2 lg:grid-cols-4";
        return (
          <div key={group} className="mb-8">
            <div className={`flex items-center gap-2 ${s.bg} ${s.border} border rounded-xl px-4 py-2.5 mb-4`}>
              <span className="text-base">{icon}</span>
              <span className={`text-sm font-bold ${s.text}`}>{group}</span>
            </div>
            <div className={`grid ${cols} gap-4`}>
              {items.map(item => <IndicatorCard key={item.name} item={item} />)}
            </div>
          </div>
        );
      })}

      {/* 데이터 출처 */}
      <div className="mt-4 bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
        <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">데이터 출처 및 산출 기준</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-y-2 gap-x-6">
          {sources.map(s => (
            <div key={s.label} className="flex items-start gap-2 text-xs text-gray-500">
              <span className="text-gray-300 mt-0.5">·</span>
              <div>
                <span className="font-semibold text-gray-700">{s.label}</span>
                <span className="text-blue-500 mx-1">({s.src})</span>
                <span>{s.note}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* 푸터 */}
      <div className="text-center text-xs text-gray-400 mt-8 space-y-1">
        <p>ⓒ {meta.year} 주간 주택시장 동향 대시보드</p>
        <p className={apiLoading ? 'text-yellow-500' : 'text-green-500'}>
          {apiLoading ? '🔄 API 데이터 로드 중...' : '✅ 실시간 API 연동 완료'}
        </p>
        <p className="text-gray-500 mt-2 text-gray-400">
          📊 데이터 출처: 한국부동산원 R-ONE API + 국토교통부 실거래가 OpenAPI
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(Dashboard));
</script>
