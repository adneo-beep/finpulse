<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산 실거래가 조회</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    body { background: #f0f2f5; font-family: 'Malgun Gothic', sans-serif; }
    .navbar { background: linear-gradient(135deg, #1a3c6e 0%, #2563eb 100%); }
    .navbar-brand { font-weight: 700; font-size: 1.3rem; letter-spacing: -.5px; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-radius: 12px; }
    .card-header { background: #fff; border-bottom: 1px solid #e9ecef; border-radius: 12px 12px 0 0 !important; font-weight: 600; }
    .btn-primary { background: #2563eb; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .stat-card { border-radius: 10px; padding: 16px 20px; color: #fff; }
    .stat-card.blue   { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .stat-card.green  { background: linear-gradient(135deg, #059669, #10b981); }
    .stat-card.red    { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .stat-card.purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
    .stat-card .label { font-size: .78rem; opacity: .85; margin-bottom: 4px; }
    .stat-card .value { font-size: clamp(.85rem, 2.5vw, 1.3rem); font-weight: 700; word-break: keep-all; }
    #resultsTable { font-size: .87rem; }
    #resultsTable th { background: #f8fafc; position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
    #resultsTable th:hover { background: #e2e8f0; }
    #resultsTable td { vertical-align: middle; white-space: nowrap; }
    .sort-icon { color: #94a3b8; font-size: .7rem; margin-left: 3px; }
    .table-container { max-height: 520px; overflow-y: auto; border-radius: 0 0 12px 12px; }
    .spinner-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
      z-index: 9999; align-items: center; justify-content: center; }
    .spinner-overlay.show { display: flex; }
    .price-cell { font-weight: 600; color: #1e40af; }
    .no-data { color: #94a3b8; text-align: center; padding: 48px; }
    .apt-link { color: #2563eb; cursor: pointer; font-weight: 600; text-decoration: underline; white-space: nowrap; }
    .apt-link:hover { color: #1d4ed8; }

    /* Detail Modal */
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1050; overflow-y: auto; }
    .detail-overlay.show { display: block; }
    .detail-panel {
      background: #fff; border-radius: 16px; max-width: 900px; margin: 40px auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .detail-panel .dp-header {
      background: linear-gradient(135deg, #1a3c6e 0%, #2563eb 100%);
      border-radius: 16px 16px 0 0; padding: 20px 24px; color: #fff;
    }
    .detail-panel .dp-header h5 { margin: 0; font-weight: 700; font-size: 1.1rem; }
    .detail-panel .dp-header .sub { font-size: .83rem; opacity: .8; margin-top: 4px; }
    .detail-panel .dp-body { padding: 20px 24px; }
    .area-btn { font-size: .8rem; padding: 3px 10px; border-radius: 20px; border: 1px solid #d1d5db;
      background: #fff; cursor: pointer; color: #374151; transition: all .15s; }
    .area-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .area-btn:hover:not(.active) { background: #f3f4f6; }
    #detailTable { font-size: .83rem; }
    #detailTable th { background: #f8fafc; white-space: nowrap; }
    #detailTable td { vertical-align: middle; white-space: nowrap; }
    .detail-table-wrap { max-height: 340px; overflow-y: auto; border-radius: 8px; border: 1px solid #e9ecef; }
  </style>
</head>
<body>

<!-- Spinner -->
<div class="spinner-overlay" id="spinner">
  <div class="text-center text-white">
    <div class="spinner-border mb-2" style="width:3rem;height:3rem;"></div>
    <div>데이터를 불러오는 중...</div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <span class="navbar-brand"><i class="bi bi-building me-2"></i>부동산 실거래가 조회</span>
</nav>

<div class="container-fluid px-4" style="max-width:1400px;">

  <!-- Search Form -->
  <div class="card mb-3">
    <div class="card-header py-2"><i class="bi bi-search me-1"></i>조회 조건</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label fw-semibold mb-1" style="font-size:.85rem;">부동산 유형</label>
          <select class="form-select" id="propType">
            <option value="apt_trade">아파트 매매</option>
            <option value="sh_trade">단독/다가구 매매</option>
            <option value="rh_trade">연립/다세대 매매</option>
            <option value="of_trade">오피스텔 매매</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold mb-1" style="font-size:.85rem;">시/도</label>
          <select class="form-select" id="sido" onchange="updateDistrict()">
            <option value="">선택</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold mb-1" style="font-size:.85rem;">시/군/구</label>
          <select class="form-select" id="district">
            <option value="">선택</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold mb-1" style="font-size:.85rem;">년도</label>
          <select class="form-select" id="year"></select>
        </div>
        <div class="col-md-1">
          <label class="form-label fw-semibold mb-1" style="font-size:.85rem;">월</label>
          <select class="form-select" id="month">
            <option value="01">1월</option><option value="02">2월</option>
            <option value="03">3월</option><option value="04">4월</option>
            <option value="05">5월</option><option value="06">6월</option>
            <option value="07">7월</option><option value="08">8월</option>
            <option value="09">9월</option><option value="10">10월</option>
            <option value="11">11월</option><option value="12">12월</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-primary w-100" onclick="doSearch()">
            <i class="bi bi-search me-1"></i>조회
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="row g-3 mb-3" id="statsRow" style="display:none!important;">
    <div class="col-6 col-md-3">
      <div class="stat-card blue">
        <div class="label">총 거래 건수</div>
        <div class="value" id="statCount">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card green">
        <div class="label">평균 거래금액</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card red">
        <div class="label">최고 거래금액</div>
        <div class="value" id="statMax">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card purple">
        <div class="label">최저 거래금액</div>
        <div class="value" id="statMin">-</div>
      </div>
    </div>
  </div>

  <!-- Trend Chart -->
  <div class="card mb-3" id="trendCard" style="display:none!important;">
    <div class="card-header py-2 d-flex justify-content-between align-items-center">
      <span id="trendTitle"><i class="bi bi-bar-chart me-1"></i>월별 거래건수 추이 (최근 24개월)</span>
      <div id="trendSpinner" class="spinner-border spinner-border-sm text-secondary d-none" role="status"></div>
    </div>
    <div class="card-body" style="position:relative; height:220px;">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- Error -->
  <div class="alert alert-danger d-none" id="errorBox"></div>

  <!-- Results Table -->
  <div class="card" id="resultCard" style="display:none!important;">
    <div class="card-header py-2">
      <span id="resultTitle"><i class="bi bi-table me-1"></i>조회 결과</span>
      <div class="input-group input-group-sm mt-2">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" id="aptSearch" placeholder="아파트명 검색" oninput="filterTable()">
      </div>
    </div>
    <div class="table-container">
      <table class="table table-hover table-bordered mb-0" id="resultsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Guide -->
  <div class="card mt-3" id="guideCard">
    <div class="card-body text-center py-5">
      <i class="bi bi-building" style="font-size:3rem;color:#cbd5e1;"></i>
      <p class="mt-3 text-muted">
        조회 조건을 선택하고 <strong>조회</strong> 버튼을 누르세요.<br>
        <small class="text-muted">국토교통부 실거래가 공개시스템 데이터를 활용합니다.</small>
      </p>
    </div>
  </div>

</div><!-- /container -->

<!-- ─── Detail Overlay ─────────────────────────────────────────────────── -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetailIfBackdrop(event)">
  <div class="detail-panel">
    <div class="dp-header d-flex justify-content-between align-items-start">
      <div>
        <h5 id="dpAptName">아파트명</h5>
        <div class="sub" id="dpSubInfo"></div>
      </div>
      <button class="btn btn-sm btn-outline-light" onclick="closeDetail()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="dp-body">

      <!-- Area selector -->
      <div class="mb-3 d-flex align-items-center gap-2 flex-wrap" id="areaFilterRow">
        <span style="font-size:.82rem;color:#6b7280;font-weight:600;">전용면적</span>
        <div id="areaBtns" class="d-flex gap-1 flex-wrap"></div>
      </div>

      <!-- Price chart -->
      <div class="card mb-3">
        <div class="card-header py-2" style="font-size:.88rem;">
          <i class="bi bi-graph-up me-1"></i>월별 평균 시세 추이
          <span id="dpChartSpinner" class="spinner-border spinner-border-sm text-secondary ms-2 d-none"></span>
        </div>
        <div class="card-body" style="position:relative;height:200px;">
          <canvas id="dpPriceChart"></canvas>
        </div>
      </div>

      <!-- Trade history table -->
      <div class="card">
        <div class="card-header py-2 d-flex justify-content-between align-items-center" style="font-size:.88rem;">
          <span><i class="bi bi-list-ul me-1"></i>개별 거래 내역 <span id="dpTradeCount" class="text-muted fw-normal"></span></span>
        </div>
        <div class="detail-table-wrap">
          <table class="table table-hover table-bordered mb-0" id="detailTable">
            <thead id="detailTableHead"></thead>
            <tbody id="detailTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

    '함안군':'48740','창녕군':'48750','고성군':'48820','남해군':'48840',
    '하동군':'48850','산청군':'48860','함양군':'48870','거창군':'48880',
    '합천군':'48890'
  },
  '제주특별자치도': { '제주시':'50110', '서귀포시':'50130' }
};

// ─── Column Definitions ──────────────────────────────────────────────────────
const COLUMNS = {
  apt_trade: [
    {k:'umdNm',l:'법정동'},{k:'aptNm',l:'아파트명',link:true},{k:'excluUseAr',l:'전용면적(㎡)'},
    {k:'floor',l:'층'},{k:'buildYear',l:'건축년도'},
    {k:'dealYear',l:'년'},{k:'dealMonth',l:'월'},{k:'dealDay',l:'일'},{k:'rgstDate',l:'등기일자'},
    {k:'dealAmount',l:'거래금액(만원)',price:true},{k:'dealingGbn',l:'거래유형'},
    {k:'slerGbn',l:'매도자'},{k:'buyerGbn',l:'매수자'}
  ],
  sh_trade: [
    {k:'umdNm',l:'법정동'},{k:'jibun',l:'지번'},{k:'houseType',l:'건물주용도'},
    {k:'totalFloorAr',l:'건물면적(㎡)'},{k:'plottageAr',l:'대지면적(㎡)'},{k:'buildYear',l:'건축년도'},
    {k:'dealYear',l:'년'},{k:'dealMonth',l:'월'},{k:'dealDay',l:'일'},
    {k:'dealAmount',l:'거래금액(만원)',price:true},{k:'dealingGbn',l:'거래유형'},
    {k:'slerGbn',l:'매도자'},{k:'buyerGbn',l:'매수자'}
  ],
  rh_trade: [
    {k:'umdNm',l:'법정동'},{k:'mhouseNm',l:'연립다세대명',link:true},{k:'excluUseAr',l:'전용면적(㎡)'},
    {k:'floor',l:'층'},{k:'buildYear',l:'건축년도'},
    {k:'dealYear',l:'년'},{k:'dealMonth',l:'월'},{k:'dealDay',l:'일'},{k:'rgstDate',l:'등기일자'},
    {k:'dealAmount',l:'거래금액(만원)',price:true},{k:'dealingGbn',l:'거래유형'},
    {k:'slerGbn',l:'매도자'},{k:'buyerGbn',l:'매수자'}
  ],
  of_trade: [
    {k:'umdNm',l:'법정동'},{k:'offiNm',l:'단지명',link:true},{k:'excluUseAr',l:'전용면적(㎡)'},
    {k:'floor',l:'층'},{k:'buildYear',l:'건축년도'},
    {k:'dealYear',l:'년'},{k:'dealMonth',l:'월'},{k:'dealDay',l:'일'},
    {k:'dealAmount',l:'거래금액(만원)',price:true},{k:'dealingGbn',l:'거래유형'},
    {k:'slerGbn',l:'매도자'},{k:'buyerGbn',l:'매수자'}
  ]
};

const PRICE_KEY = {
  apt_trade:'dealAmount', sh_trade:'dealAmount', rh_trade:'dealAmount', of_trade:'dealAmount'
};

// name key per type (for detail view)
const NAME_KEY = { apt_trade:'aptNm', rh_trade:'mhouseNm', of_trade:'offiNm' };

let currentData = [];
let sortCol = -1, sortAsc = true;
let trendChart = null;
let trendAllData = [];   // [{label, ym, items}] for 24 months
let dpPriceChart = null;
let currentType = 'apt_trade';

// ─── Init ─────────────────────────────────────────────────────────────────────
(function init() {
  const y = document.getElementById('year');
  const now = new Date();
  for (let i = now.getFullYear(); i >= 2006; i--) {
    const o = document.createElement('option');
    o.value = o.textContent = i;
    y.appendChild(o);
  }
  const prevMonth = now.getMonth() === 0 ? 12 : now.getMonth();
  document.getElementById('month').value = String(prevMonth).padStart(2, '0');
  if (now.getMonth() === 0) document.getElementById('year').value = now.getFullYear() - 1;

  const sido = document.getElementById('sido');
  Object.keys(REGIONS).forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    sido.appendChild(o);
  });

})();

function updateDistrict() {
  const sido = document.getElementById('sido').value;
  const sel = document.getElementById('district');
  sel.innerHTML = '<option value="">선택</option>';
  if (!sido || !REGIONS[sido]) return;
  Object.entries(REGIONS[sido]).forEach(([name, code]) => {
    const o = document.createElement('option');
    o.value = code; o.textContent = name;
    sel.appendChild(o);
  });
}

// ─── Search ──────────────────────────────────────────────────────────────────
async function doSearch() {
  const type   = document.getElementById('propType').value;
  const lawdCd = document.getElementById('district').value;
  const year   = document.getElementById('year').value;
  const month  = document.getElementById('month').value;

  if (!lawdCd) { alert('시/도 및 시/군/구를 선택해주세요.'); return; }

  currentType = type;
  document.getElementById('aptSearch').value = '';
  const dealYmd = `${year}${month}`;
  hideError();
  showSpinner(true);

  try {
    const resp = await fetch(`/api/search?type=${type}&lawdCd=${lawdCd}&dealYmd=${dealYmd}`);
    const data = await resp.json();
    if (data.error) { showError(data.error); return; }
    renderResults(type, data.items || []);
    fetchAndRenderTrend(type, lawdCd, parseInt(year), parseInt(month));
  } catch (e) {
    showError('네트워크 오류가 발생했습니다.');
  } finally {
    showSpinner(false);
  }
}

// ─── Trend (24 months) ───────────────────────────────────────────────────────
async function fetchAndRenderTrend(type, lawdCd, year, month) {
  const trendCard = document.getElementById('trendCard');
  const trendSpinner = document.getElementById('trendSpinner');
  trendCard.style.display = '';
  trendSpinner.classList.remove('d-none');
  trendAllData = [];

  const months = [];
  for (let i = 23; i >= 0; i--) {
    const d = new Date(year, month - 1 - i, 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    months.push({ label: `${y}.${m}`, ym: `${y}${m}` });
  }

  const results = await Promise.all(months.map(async ({ label, ym }) => {
    try {
      const r = await fetch(`/api/search?type=${type}&lawdCd=${lawdCd}&dealYmd=${ym}`);
      const d = await r.json();
      const items = d.items || [];
      return { label, ym, items, count: items.length };
    } catch {
      return { label, ym, items: [], count: 0 };
    }
  }));

  trendAllData = results;
  trendSpinner.classList.add('d-none');

  const labels = results.map(r => r.label);
  const counts = results.map(r => r.count);
  const colors = counts.map((_, i) => i === counts.length - 1 ? '#2563eb' : '#93c5fd');

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();

  trendChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: '거래건수', data: counts, backgroundColor: colors, borderRadius: 4 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.raw.toLocaleString()}건` } },
        datalabels: {
          anchor: 'end', align: 'end',
          formatter: v => v === 0 ? '' : v.toLocaleString(),
          font: { size: 10, weight: '600' }, color: '#374151'
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => `${v}건` } },
        x: { ticks: { font: { size: 10 } } }
      }
    },
    plugins: [ChartDataLabels]
  });

  const districtName = document.getElementById('district').selectedOptions[0]?.text || '';
  const sido = document.getElementById('sido').value;
  document.getElementById('trendTitle').innerHTML =
    `<i class="bi bi-bar-chart me-1"></i>${sido} ${districtName} — 월별 거래건수 추이 (최근 24개월)`;
}

// ─── Render Results ───────────────────────────────────────────────────────────
function renderResults(type, items) {
  currentData = items;
  sortCol = -1;
  document.getElementById('guideCard').style.display = 'none';

  const priceKey = PRICE_KEY[type];
  const prices = items.map(it => parsePrice(it[priceKey])).filter(v => !isNaN(v));
  document.getElementById('statCount').textContent = items.length.toLocaleString() + '건';
  if (prices.length) {
    const avg = Math.round(prices.reduce((a,b) => a+b,0) / prices.length);
    document.getElementById('statAvg').textContent = formatPrice(avg);
    document.getElementById('statMax').textContent = formatPrice(Math.max(...prices));
    document.getElementById('statMin').textContent = formatPrice(Math.min(...prices));
  } else {
    ['statAvg','statMax','statMin'].forEach(id => document.getElementById(id).textContent = '-');
  }

  document.getElementById('statsRow').style.display = '';
  document.getElementById('resultCard').style.display = '';

  const districtName = document.getElementById('district').selectedOptions[0]?.text || '';
  const sido = document.getElementById('sido').value;
  const year = document.getElementById('year').value;
  const month = document.getElementById('month').value;
  document.getElementById('resultTitle').innerHTML =
    `<i class="bi bi-table me-1"></i>${sido} ${districtName} — ${year}년 ${parseInt(month)}월 조회결과 (${items.length.toLocaleString()}건)`;

  const cols = COLUMNS[type] || [];
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  cols.forEach((col, i) => {
    const th = document.createElement('th');
    th.innerHTML = col.l + `<span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span>`;
    th.onclick = () => sortTable(i, cols);
    tr.appendChild(th);
  });
  thead.appendChild(tr);

  renderTableBody(cols, items, type);
}

function renderTableBody(cols, items, type) {
  type = type || currentType;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  if (!items.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${cols.length}" class="no-data"><i class="bi bi-inbox me-2"></i>조회된 데이터가 없습니다.</td>`;
    tbody.appendChild(tr);
    return;
  }
  items.forEach(item => {
    const tr = document.createElement('tr');
    cols.forEach(col => {
      const td = document.createElement('td');
      let val = item[col.k] || '-';
      if (col.link && val !== '-') {
        td.innerHTML = `<span class="apt-link" onclick="openAptDetail('${val.replace(/'/g,"\\'")}','${type}')">${val}</span>`;
      } else if (col.price && val !== '-') {
        const num = parsePrice(val);
        td.className = 'price-cell';
        td.textContent = isNaN(num) ? val : formatPrice(num);
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// ─── Filter by apartment name ─────────────────────────────────────────────────
function filterTable() {
  const q = document.getElementById('aptSearch').value.trim().toLowerCase();
  const type = currentType;
  const cols = COLUMNS[type] || [];
  const nameKey = NAME_KEY[type];
  const filtered = q && nameKey
    ? currentData.filter(it => (it[nameKey] || '').toLowerCase().includes(q))
    : currentData;
  renderTableBody(cols, filtered, type);
}

// ─── Sort ─────────────────────────────────────────────────────────────────────
function sortTable(colIdx, cols) {
  const col = cols[colIdx];
  if (sortCol === colIdx) sortAsc = !sortAsc;
  else { sortCol = colIdx; sortAsc = true; }

  currentData.sort((a, b) => {
    let va = a[col.k] || '', vb = b[col.k] || '';
    if (col.price) {
      va = parsePrice(va) || 0; vb = parsePrice(vb) || 0;
      return sortAsc ? va - vb : vb - va;
    }
    const na = parseFloat(va.replace(/,/g,'')), nb = parseFloat(vb.replace(/,/g,''));
    if (!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
    return sortAsc ? va.localeCompare(vb,'ko') : vb.localeCompare(va,'ko');
  });

  document.querySelectorAll('#tableHead th .sort-icon').forEach((el, i) => {
    el.innerHTML = i === colIdx
      ? (sortAsc ? '<i class="bi bi-arrow-up"></i>' : '<i class="bi bi-arrow-down"></i>')
      : '<i class="bi bi-arrow-down-up"></i>';
  });
  renderTableBody(cols, currentData, currentType);
}


// ─── Detail View ──────────────────────────────────────────────────────────────
let detailAptName = '';
let detailType = '';
let selectedArea = '';

function openAptDetail(aptNm, type) {
  detailAptName = aptNm;
  detailType = type;
  selectedArea = '';

  document.getElementById('dpAptName').textContent = aptNm;

  // sub info: 법정동 + 건축년도
  const nameKey = NAME_KEY[type];
  const sample = currentData.find(it => it[nameKey] === aptNm);
  if (sample) {
    const loc = [sample.umdNm, sample.buildYear ? `${sample.buildYear}년 준공` : ''].filter(Boolean).join(' · ');
    document.getElementById('dpSubInfo').textContent = loc;
  } else {
    document.getElementById('dpSubInfo').textContent = '';
  }

  // Collect all items from 24-month cache + current month
  const allItems = getAllItemsForApt(aptNm, type);

  // Area buttons
  const areas = [...new Set(allItems.map(it => it.excluUseAr).filter(Boolean))]
    .sort((a,b) => parseFloat(a) - parseFloat(b));
  const areaBtns = document.getElementById('areaBtns');
  areaBtns.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'area-btn active';
  allBtn.textContent = '전체';
  allBtn.dataset.area = '';
  allBtn.onclick = () => selectArea('', type);
  areaBtns.appendChild(allBtn);
  areas.forEach(ar => {
    const btn = document.createElement('button');
    btn.className = 'area-btn';
    btn.textContent = `${ar}㎡`;
    btn.dataset.area = ar;
    btn.onclick = () => selectArea(ar, type);
    areaBtns.appendChild(btn);
  });

  document.getElementById('areaFilterRow').style.display = areas.length ? '' : 'none';

  renderDetailChart(aptNm, type, '');
  renderDetailTable(aptNm, type, '');

  document.getElementById('detailOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function selectArea(area, type) {
  selectedArea = area;
  document.querySelectorAll('.area-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.area === area);
  });
  renderDetailChart(detailAptName, type, area);
  renderDetailTable(detailAptName, type, area);
}

function getAllItemsForApt(aptNm, type) {
  const nameKey = NAME_KEY[type];
  if (!nameKey) return [];
  const fromCache = trendAllData.flatMap(m => m.items.filter(it => it[nameKey] === aptNm));
  const fromCurrent = currentData.filter(it => it[nameKey] === aptNm);
  // merge (avoid duplicates by ym+day+floor+amount)
  const seen = new Set(fromCache.map(it => `${it.dealYear}${it.dealMonth}${it.dealDay}${it.floor}${it.dealAmount}`));
  const extra = fromCurrent.filter(it => {
    const k = `${it.dealYear}${it.dealMonth}${it.dealDay}${it.floor}${it.dealAmount}`;
    return !seen.has(k);
  });
  return [...fromCache, ...extra];
}

function renderDetailChart(aptNm, type, area) {
  const nameKey = NAME_KEY[type];
  if (!nameKey || !trendAllData.length) return;

  const monthLabels = trendAllData.map(m => m.label);
  const avgPrices = trendAllData.map(m => {
    let items = m.items.filter(it => it[nameKey] === aptNm);
    if (area) items = items.filter(it => it.excluUseAr === area);
    if (!items.length) return null;
    const prices = items.map(it => parsePrice(it.dealAmount)).filter(v => !isNaN(v));
    return prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : null;
  });

  const ctx = document.getElementById('dpPriceChart').getContext('2d');
  if (dpPriceChart) dpPriceChart.destroy();

  dpPriceChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: monthLabels,
      datasets: [{
        label: '평균 거래금액',
        data: avgPrices,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,.1)',
        pointBackgroundColor: '#2563eb',
        pointRadius: 4,
        tension: 0.3,
        fill: true,
        spanGaps: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        datalabels: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.raw !== null ? formatPrice(ctx.raw) : '거래없음'
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          ticks: { callback: v => formatPrice(v), font: { size: 10 } }
        },
        x: { ticks: { font: { size: 10 } } }
      }
    },
    plugins: [ChartDataLabels]
  });
}

function renderDetailTable(aptNm, type, area) {
  const nameKey = NAME_KEY[type];
  if (!nameKey) return;

  let items = getAllItemsForApt(aptNm, type);
  if (area) items = items.filter(it => it.excluUseAr === area);

  // Sort by date desc
  items.sort((a,b) => {
    const da = `${a.dealYear}${String(a.dealMonth).padStart(2,'0')}${String(a.dealDay).padStart(2,'0')}`;
    const db = `${b.dealYear}${String(b.dealMonth).padStart(2,'0')}${String(b.dealDay).padStart(2,'0')}`;
    return db.localeCompare(da);
  });

  document.getElementById('dpTradeCount').textContent = `(${items.length}건)`;

  const detailCols = [
    {k:'excluUseAr',l:'전용면적(㎡)'},{k:'floor',l:'층'},
    {k:'dealYear',l:'년'},{k:'dealMonth',l:'월'},{k:'dealDay',l:'일'},{k:'rgstDate',l:'등기일자'},
    {k:'dealAmount',l:'거래금액(만원)',price:true},{k:'dealingGbn',l:'거래유형'},
    {k:'slerGbn',l:'매도자'},{k:'buyerGbn',l:'매수자'}
  ].filter(c => !(type === 'of_trade' && c.k === 'rgstDate'));

  const thead = document.getElementById('detailTableHead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  detailCols.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col.l;
    tr.appendChild(th);
  });
  thead.appendChild(tr);

  const tbody = document.getElementById('detailTableBody');
  tbody.innerHTML = '';
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="${detailCols.length}" class="no-data"><i class="bi bi-inbox me-2"></i>거래 내역이 없습니다.</td></tr>`;
    return;
  }
  items.forEach(item => {
    const tr = document.createElement('tr');
    detailCols.forEach(col => {
      const td = document.createElement('td');
      const val = item[col.k] || '-';
      if (col.price && val !== '-') {
        const num = parsePrice(val);
        td.className = 'price-cell';
        td.textContent = isNaN(num) ? val : formatPrice(num);
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  document.body.style.overflow = '';
  if (dpPriceChart) { dpPriceChart.destroy(); dpPriceChart = null; }
}

function closeDetailIfBackdrop(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function parsePrice(str) {
  if (!str) return NaN;
  return parseInt(String(str).replace(/,/g,'').trim());
}

function formatPrice(won) {
  if (isNaN(won) || won === null) return '-';
  if (won >= 10000) {
    const eok = Math.floor(won / 10000);
    const man = won % 10000;
    return man === 0 ? `${eok}억` : `${eok}억 ${man.toLocaleString()}만`;
  }
  return `${won.toLocaleString()}만`;
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.remove('d-none');
}

function hideError() { document.getElementById('errorBox').classList.add('d-none'); }
function showSpinner(show) { document.getElementById('spinner').classList.toggle('show', show); }
</script>
