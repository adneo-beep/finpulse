<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Malgun Gothic', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 24px;
    color: #e94560;
    text-shadow: 0 0 12px #e9456066;
    letter-spacing: 4px;
  }

  /* ── 설정 패널 ── */
  #setup {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 600px;
  }

  .section-title {
    font-size: 0.85rem;
    color: #a0a0c0;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    min-height: 36px;
    background: #0d1b2a;
    border-radius: 8px;
    padding: 6px 8px;
  }

  .tag {
    background: #0f3460;
    border: 1px solid #e94560;
    color: #fff;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: default;
  }

  .tag .del {
    cursor: pointer;
    color: #e94560;
    font-weight: bold;
    font-size: 0.9rem;
    line-height: 1;
  }
  .tag .del:hover { color: #fff; }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .input-row input {
    flex: 1;
    background: #0d1b2a;
    border: 1px solid #0f3460;
    border-radius: 8px;
    color: #eee;
    padding: 8px 12px;
    font-size: 0.95rem;
    outline: none;
  }
  .input-row input:focus { border-color: #e94560; }

  .btn {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn:hover { background: #c73652; }
  .btn.secondary {
    background: #0f3460;
  }
  .btn.secondary:hover { background: #1a4a8a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  /* ── 게임 화면 ── */
  #game { display: none; width: 100%; max-width: 960px; }

  #canvas-wrap {
    position: relative;
    overflow-x: auto;
    padding: 10px 0;
  }

  canvas {
    display: block;
    margin: 0 auto;
  }

  /* ── 결과 표시 ── */
  #results {
    display: none;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }

  .result-card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 10px;
    padding: 12px 20px;
    text-align: center;
    min-width: 100px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s, transform 0.4s;
  }
  .result-card.show { opacity: 1; transform: translateY(0); }
  .result-card .name { font-size: 0.9rem; color: #a0a0c0; margin-bottom: 4px; }
  .result-card .prize { font-size: 1.1rem; font-weight: bold; color: #e94560; }

  #game-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<h1>🪜 사다리 게임</h1>

<!-- 설정 패널 -->
<div id="setup">
  <div class="section-title">참가자 이름 (Enter 또는 추가 버튼)</div>
  <div class="tag-row" id="player-tags"></div>
  <div class="input-row">
    <input id="player-input" type="text" placeholder="이름 입력">
    <button class="btn" onclick="addPlayer()">추가</button>
  </div>

  <div class="section-title">결과 항목</div>
  <div class="tag-row" id="prize-tags"></div>
  <div class="input-row">
    <input id="prize-input" type="text" placeholder="결과 입력 (꽝, 당첨, ...)">
    <button class="btn" onclick="addPrize()">추가</button>
  </div>

  <div class="controls">
    <button class="btn" id="start-btn" onclick="startGame()" disabled>게임 시작</button>
    <button class="btn secondary" onclick="loadSample()">샘플 불러오기</button>
  </div>
</div>

<!-- 게임 화면 -->
<div id="game">
  <div id="canvas-wrap">
    <canvas id="ladder-canvas"></canvas>
  </div>
  <div id="results"></div>
  <div id="game-controls">
    <button class="btn" id="reveal-btn" onclick="revealAll()">전체 공개</button>
    <button class="btn secondary" onclick="resetGame()">다시 설정</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
//  State
// ────────────────────────────────────────────────
let players = [];
let prizes  = [];
let ladder  = [];   // ladder[col][row] = true if horizontal rung to the right
let paths   = [];   // paths[playerIndex] = [{x,y}, ...]
let assignedPrizes = [];

const COLS_MARGIN = 60;
const TOP_MARGIN  = 60;
const BOT_MARGIN  = 60;
const RUNG_ROWS   = 10;
const COL_W       = 90;
const LADDER_H    = 400;

// ────────────────────────────────────────────────
//  Tag helpers
// ────────────────────────────────────────────────
function renderTags() {
  document.getElementById('player-tags').innerHTML =
    players.map((p, i) =>
      `<span class="tag">${p}<span class="del" onclick="removePlayer(${i})">✕</span></span>`
    ).join('');
  document.getElementById('prize-tags').innerHTML =
    prizes.map((p, i) =>
      `<span class="tag">${p}<span class="del" onclick="removePrize(${i})">✕</span></span>`
    ).join('');
  checkReady();
}

function addPlayer() {
  const inp = document.getElementById('player-input');
  const v = inp.value.trim();
  if (v && !players.includes(v)) { players.push(v); renderTags(); }
  inp.value = '';
  inp.focus();
}
function removePlayer(i) { players.splice(i, 1); renderTags(); }

function addPrize() {
  const inp = document.getElementById('prize-input');
  const v = inp.value.trim();
  if (v) { prizes.push(v); renderTags(); }
  inp.value = '';
  inp.focus();
}
function removePrize(i) { prizes.splice(i, 1); renderTags(); }

function checkReady() {
  document.getElementById('start-btn').disabled =
    players.length < 2 || prizes.length < 1;
}

// Enter key support
document.getElementById('player-input').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
document.getElementById('prize-input').addEventListener('keydown',  e => { if (e.key === 'Enter') addPrize(); });

function loadSample() {
  players = ['철수', '영희', '민준', '지수', '서현'];
  prizes  = ['1등', '2등', '꽝', '꽝', '치킨'];
  renderTags();
}

// ────────────────────────────────────────────────
//  Ladder generation
// ────────────────────────────────────────────────
function generateLadder(n) {
  // ladder[col][row]: whether there's a rung from col → col+1 at row
  const L = Array.from({ length: n - 1 }, () => Array(RUNG_ROWS).fill(false));
  for (let row = 0; row < RUNG_ROWS; row++) {
    for (let col = 0; col < n - 1; col++) {
      if (L[col][row]) { col++; continue; } // skip if prev col already has rung here
      if (Math.random() < 0.4) {
        L[col][row] = true;
        col++; // can't have adjacent rungs
      }
    }
  }
  return L;
}

// ────────────────────────────────────────────────
//  Path calculation
// ────────────────────────────────────────────────
function calcPaths(n, ladder) {
  const rowH = LADDER_H / RUNG_ROWS;
  const colX = i => COLS_MARGIN + i * COL_W;
  const rowY = r => TOP_MARGIN + r * rowH;

  return Array.from({ length: n }, (_, start) => {
    const pts = [];
    let col = start;
    pts.push({ x: colX(col), y: TOP_MARGIN });

    for (let row = 0; row < RUNG_ROWS; row++) {
      const y = rowY(row);
      const ny = rowY(row + 1);

      // arrived at row top
      pts.push({ x: colX(col), y });

      // check rung to the right (col → col+1)
      if (col < n - 1 && ladder[col][row]) {
        pts.push({ x: colX(col + 1), y });
        col++;
      }
      // check rung to the left (col-1 → col)
      else if (col > 0 && ladder[col - 1][row]) {
        pts.push({ x: colX(col - 1), y });
        col--;
      }

      pts.push({ x: colX(col), y: ny });
    }

    pts.push({ x: colX(col), y: TOP_MARGIN + LADDER_H });
    return { pts, prize: col };
  });
}

// ────────────────────────────────────────────────
//  Start game
// ────────────────────────────────────────────────
function startGame() {
  const n = players.length;

  // Pad or trim prizes to match player count
  while (prizes.length < n) prizes.push('꽝');
  let prizePool = shuffleArray([...prizes.slice(0, n)]);

  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display  = 'block';

  ladder = generateLadder(n);
  const pathData = calcPaths(n, ladder);
  paths  = pathData.map(p => p.pts);
  assignedPrizes = pathData.map((p, i) => prizePool[p.prize]);

  // Shuffle so revealed prize col doesn't leak assignment
  // Actually we display prize by the END column the player lands on,
  // and prizePool is already shuffled → prizePool[endCol]
  // Re-map: prize at bottom col = prizePool[col]
  assignedPrizes = pathData.map(p => prizePool[p.prize]);

  const canvas = document.getElementById('ladder-canvas');
  const totalW = COLS_MARGIN * 2 + (n - 1) * COL_W;
  const totalH = TOP_MARGIN + LADDER_H + BOT_MARGIN;
  canvas.width  = totalW;
  canvas.height = totalH;

  drawLadder(prizePool);
  setupResultCards();
  animatePaths();
}

// ────────────────────────────────────────────────
//  Drawing
// ────────────────────────────────────────────────
const COLORS = ['#e94560','#00b4d8','#80ed99','#f4a261','#c77dff',
                '#ff9f1c','#06d6a0','#ef476f','#ffd166','#118ab2'];

function colX(i) { return COLS_MARGIN + i * COL_W; }
function rowY(r) { return TOP_MARGIN + r * (LADDER_H / RUNG_ROWS); }

function drawLadder(prizePool) {
  const canvas = document.getElementById('ladder-canvas');
  const ctx = canvas.getContext('2d');
  const n = players.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Vertical lines
  ctx.lineWidth = 3;
  for (let i = 0; i < n; i++) {
    ctx.strokeStyle = '#2a4a7f';
    ctx.beginPath();
    ctx.moveTo(colX(i), TOP_MARGIN);
    ctx.lineTo(colX(i), TOP_MARGIN + LADDER_H);
    ctx.stroke();
  }

  // Horizontal rungs
  ctx.strokeStyle = '#3a6abf';
  ctx.lineWidth = 2;
  const rowH = LADDER_H / RUNG_ROWS;
  for (let col = 0; col < n - 1; col++) {
    for (let row = 0; row < RUNG_ROWS; row++) {
      if (ladder[col][row]) {
        const y = TOP_MARGIN + row * rowH;
        ctx.beginPath();
        ctx.moveTo(colX(col), y);
        ctx.lineTo(colX(col + 1), y);
        ctx.stroke();
      }
    }
  }

  // Player labels (top)
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Malgun Gothic';
  for (let i = 0; i < n; i++) {
    const x = colX(i);
    ctx.fillStyle = COLORS[i % COLORS.length];
    roundRect(ctx, x - 28, 8, 56, 28, 6);
    ctx.fillStyle = '#fff';
    ctx.fillText(players[i], x, 26);
  }

  // Prize labels (bottom)
  const by = TOP_MARGIN + LADDER_H + 10;
  for (let i = 0; i < n; i++) {
    const x = colX(i);
    ctx.fillStyle = '#0f3460';
    roundRect(ctx, x - 28, by, 56, 28, 6);
    ctx.fillStyle = '#aaa';
    ctx.font = '13px Malgun Gothic';
    ctx.fillText(prizePool[i], x, by + 18);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

// ────────────────────────────────────────────────
//  Animation
// ────────────────────────────────────────────────
let animFrames = [];   // per-player segment progress
let animDone   = [];
let totalPts   = [];
let rafId      = null;
let prizePoolCache = [];

function animatePaths() {
  const n = players.length;
  animFrames = Array(n).fill(0);
  animDone   = Array(n).fill(false);
  totalPts   = paths.map(p => p.length - 1);

  const SPEED = 0.06; // segments per frame

  function frame() {
    const canvas = document.getElementById('ladder-canvas');
    const ctx = canvas.getContext('2d');

    // Redraw base
    drawLadder(prizePoolCache);

    let allDone = true;
    for (let pi = 0; pi < n; pi++) {
      if (animDone[pi]) {
        drawPath(ctx, pi, totalPts[pi]);
        continue;
      }
      allDone = false;
      animFrames[pi] = Math.min(animFrames[pi] + SPEED, totalPts[pi]);
      drawPath(ctx, pi, animFrames[pi]);
      if (animFrames[pi] >= totalPts[pi]) {
        animDone[pi] = true;
        showResultCard(pi);
      }
    }

    if (!allDone) {
      rafId = requestAnimationFrame(frame);
    } else {
      document.getElementById('reveal-btn').disabled = true;
    }
  }
  rafId = requestAnimationFrame(frame);
}

function drawPath(ctx, pi, progress) {
  const pts = paths[pi];
  const color = COLORS[pi % COLORS.length];
  const seg = Math.floor(progress);
  const frac = progress - seg;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);

  for (let s = 0; s < seg; s++) {
    ctx.lineTo(pts[s + 1].x, pts[s + 1].y);
  }
  if (seg < pts.length - 1) {
    const fx = pts[seg].x + (pts[seg + 1].x - pts[seg].x) * frac;
    const fy = pts[seg].y + (pts[seg + 1].y - pts[seg].y) * frac;
    ctx.lineTo(fx, fy);
    // dot at head
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(fx, fy, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.stroke();
  }
  ctx.restore();
}

// ────────────────────────────────────────────────
//  Result cards
// ────────────────────────────────────────────────
function setupResultCards() {
  const div = document.getElementById('results');
  div.style.display = 'flex';
  div.innerHTML = players.map((p, i) =>
    `<div class="result-card" id="rc-${i}">
       <div class="name">${p}</div>
       <div class="prize" id="rp-${i}">?</div>
     </div>`
  ).join('');
}

function showResultCard(i) {
  const card = document.getElementById(`rc-${i}`);
  card.classList.add('show');
  document.getElementById(`rp-${i}`).textContent = assignedPrizes[i];
}

function revealAll() {
  if (rafId) cancelAnimationFrame(rafId);
  const n = players.length;
  const canvas = document.getElementById('ladder-canvas');
  const ctx = canvas.getContext('2d');
  drawLadder(prizePoolCache);
  for (let pi = 0; pi < n; pi++) {
    drawPath(ctx, pi, totalPts[pi]);
    showResultCard(pi);
  }
  document.getElementById('reveal-btn').disabled = true;
}

// ────────────────────────────────────────────────
//  Reset
// ────────────────────────────────────────────────
function resetGame() {
  if (rafId) cancelAnimationFrame(rafId);
  document.getElementById('game').style.display  = 'none';
  document.getElementById('setup').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('reveal-btn').disabled = false;
}

// ────────────────────────────────────────────────
//  Util
// ────────────────────────────────────────────────
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Patch startGame to cache prizePool for redraw
const _origStart = startGame;
// Re-implement to capture prizePool
function startGame() {
  const n = players.length;
  while (prizes.length < n) prizes.push('꽝');
  let prizePool = shuffleArray([...prizes.slice(0, n)]);
  prizePoolCache = prizePool;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display  = 'block';

  ladder = generateLadder(n);
  const pathData = calcPaths(n, ladder);
  paths  = pathData.map(p => p.pts);
  assignedPrizes = pathData.map(p => prizePool[p.prize]);

  const canvas = document.getElementById('ladder-canvas');
  const totalW = COLS_MARGIN * 2 + (n - 1) * COL_W;
  const totalH = TOP_MARGIN + LADDER_H + BOT_MARGIN;
  canvas.width  = totalW;
  canvas.height = totalH;

  drawLadder(prizePool);
  setupResultCards();
  animatePaths();
}
</script>
</body>
</html>
