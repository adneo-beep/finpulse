<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>똥 피하기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(100, 80, 255, 0.3);
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: all;
    }
    .screen.active { display: flex; }
    .title {
      font-size: 52px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 20px rgba(255,200,50,0.5);
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 15px;
      color: #aaa;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.7;
    }
    .score-big {
      font-size: 80px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
    }
    .btn {
      margin-top: 8px;
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #fff;
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 20px rgba(255,255,255,0.15);
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(255,255,255,0.25); }
    .btn:active { transform: scale(0.97); }
    .best { font-size: 14px; color: #ffd700; font-weight: 600; }

    /* 모바일 발사 버튼 */
    #fireBtn {
      position: absolute;
      bottom: 28px;
      right: 28px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,80,80,0.85);
      border: 2.5px solid #fff;
      font-size: 28px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255,80,80,0.4);
      pointer-events: all;
      user-select: none;
    }
    #fireBtn.show { display: flex; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="screen active" id="startScreen">
    <div class="title">💩 피하기</div>
    <div class="subtitle">
      ← → 또는 A / D : 이동<br>
      <strong style="color:#ff9">스페이스바</strong> : 🚀 미사일 발사
    </div>
    <button class="btn" onclick="startGame()">시작하기</button>
  </div>
  <div class="screen" id="overScreen">
    <div class="label">game over</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="best" id="bestScore"></div>
    <button class="btn" onclick="startGame()">다시하기</button>
  </div>
  <button id="fireBtn" ontouchstart="fireMissile(); event.preventDefault()">🚀</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 420, H = 620;
canvas.width = W;
canvas.height = H;

let player, poops, missiles, particles, score, lives, level, frame;
let running = false;
let bestScore = 0;
let keys = {};
let lastFireFrame = -99;

const PLAYER_W = 48, PLAYER_H = 48;
const POOP_SIZE = 32;
const FLOOR = H - 60;
const MAX_AMMO = 5;
const FIRE_COOLDOWN = 18;

// mobile 감지
const isMobile = 'ontouchstart' in window;
if (isMobile) document.getElementById('fireBtn').classList.add('show');

// ─── Init ──────────────────────────────────────────────────
function startGame() {
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('overScreen').classList.remove('active');

  player = { x: W / 2, y: FLOOR - PLAYER_H / 2, vx: 0, invincible: 0, ammo: MAX_AMMO, ammoTimer: 0 };
  poops = [];
  missiles = [];
  particles = [];
  score = 0;
  lives = 3;
  level = 1;
  frame = 0;
  lastFireFrame = -99;
  running = true;
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  if (score > bestScore) bestScore = score;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent =
    bestScore > 0 ? `최고 기록: ${bestScore}` : '';
  document.getElementById('overScreen').classList.add('active');
}

// ─── Missile ──────────────────────────────────────────────
function fireMissile() {
  if (!running) return;
  if (player.ammo <= 0) return;
  if (frame - lastFireFrame < FIRE_COOLDOWN) return;

  player.ammo--;
  lastFireFrame = frame;

  missiles.push({
    x: player.x,
    y: player.y - 10,
    vy: -13,
    trail: []
  });
}

// ─── Spawn ────────────────────────────────────────────────
function spawnPoop() {
  const speed = 2.5 + level * 0.6 + Math.random() * 1.5;
  poops.push({
    x: 30 + Math.random() * (W - 60),
    y: -POOP_SIZE,
    vy: speed,
    vx: (Math.random() - 0.5) * 1.2,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.12,
    size: POOP_SIZE + Math.random() * 14
  });
}

// ─── Particles ────────────────────────────────────────────
function burst(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i + Math.random() * 0.5;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1, decay: 0.03 + Math.random() * 0.03,
      r: 3 + Math.random() * 4,
      color
    });
  }
}

function bigExplosion(x, y) {
  const colors = ['#ff6600','#ffcc00','#ff3300','#fff700','#ff9900','#ff4488'];
  for (let i = 0; i < 48; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 9;
    const color = colors[Math.floor(Math.random() * colors.length)];
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      life: 1, decay: 0.018 + Math.random() * 0.025,
      r: 4 + Math.random() * 8,
      color
    });
  }
  // 충격파 링
  particles.push({ x, y, vx: 0, vy: 0, life: 1, decay: 0.06, r: 4, color: '#fff', ring: true, maxR: 55 });
}

// ─── Collision ────────────────────────────────────────────
function checkPlayerHit(p) {
  const dx = Math.abs(player.x - p.x);
  const dy = Math.abs(player.y + PLAYER_H / 2 - p.y - p.size / 2);
  return dx < (PLAYER_W / 2 + p.size * 0.3) && dy < (PLAYER_H / 2 + p.size * 0.35);
}

function checkMissileHit(m, p) {
  const dx = Math.abs(m.x - p.x);
  const dy = Math.abs(m.y - (p.y + p.size / 2));
  return dx < p.size * 0.55 && dy < p.size * 0.55;
}

// ─── Draw ─────────────────────────────────────────────────
function drawGradBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1a2e');
  g.addColorStop(1, '#16213e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR + PLAYER_H / 2 + 4);
  ctx.lineTo(W, FLOOR + PLAYER_H / 2 + 4);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const inv = player.invincible > 0 && Math.floor(frame / 4) % 2 === 0;
  if (inv) return;

  ctx.save();
  ctx.translate(player.x, player.y + PLAYER_H / 2);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, PLAYER_H / 2 - 2, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  const grad = ctx.createRadialGradient(-6, -8, 2, 0, 0, 26);
  grad.addColorStop(0, '#ffe880');
  grad.addColorStop(1, '#f5c400');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(-7, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6, -5, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -5, 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (lives >= 3)       ctx.arc(0, 4,  9, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (lives === 2) { ctx.moveTo(-8, 10); ctx.lineTo(8, 10); }
  else                  ctx.arc(0, 14, 9, 1.15 * Math.PI, 1.85 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawMissile(m) {
  // trail
  ctx.save();
  for (let i = 0; i < m.trail.length; i++) {
    const t = m.trail[i];
    const alpha = (i / m.trail.length) * 0.6;
    const r = (i / m.trail.length) * 6;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = i % 2 === 0 ? '#ff6600' : '#ffcc00';
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // missile emoji
  ctx.font = '22px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('🚀', 0, 0);
  ctx.restore();

  ctx.restore();
}

function drawPoop(p) {
  ctx.save();
  ctx.translate(p.x, p.y + p.size / 2);
  ctx.rotate(p.rot);
  ctx.font = `${p.size}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💩', 0, 0);
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    if (p.ring) {
      const r = p.maxR * (1 - p.life);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawHUD() {
  ctx.save();

  // 점수
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 26px Segoe UI';
  ctx.textAlign = 'left';
  ctx.fillText(score, 20, 38);

  ctx.font = '11px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText(`LV ${level}`, 20, 54);

  // 하트
  ctx.font = '22px serif';
  ctx.textAlign = 'right';
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '❤️' : '🖤';
  ctx.fillText(hearts, W - 16, 38);

  // 미사일 탄약
  const ammoY = H - 22;
  ctx.textAlign = 'center';
  ctx.font = '12px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('MISSILE', W / 2, ammoY - 18);

  for (let i = 0; i < MAX_AMMO; i++) {
    const x = W / 2 - (MAX_AMMO - 1) * 14 + i * 28;
    ctx.font = '18px serif';
    ctx.globalAlpha = i < player.ammo ? 1 : 0.22;
    ctx.fillText('🚀', x, ammoY);
  }
  ctx.globalAlpha = 1;

  // 장전 중 표시
  if (player.ammo < MAX_AMMO) {
    const pct = player.ammoTimer / 180;
    const barW = 80;
    const bx = W / 2 - barW / 2;
    const by = ammoY + 10;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(bx, by, barW, 4, 2);
    ctx.fill();
    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.roundRect(bx, by, barW * pct, 4, 2);
    ctx.fill();
  }

  ctx.restore();
}

// ─── Main loop ────────────────────────────────────────────
function loop() {
  if (!running) return;
  frame++;

  level = 1 + Math.floor(score / 15);
  const spawnRate = Math.max(28, 70 - level * 5);
  if (frame % spawnRate === 0) spawnPoop();

  // 자동 탄약 충전 (3초마다 1발)
  if (player.ammo < MAX_AMMO) {
    player.ammoTimer++;
    if (player.ammoTimer >= 180) {
      player.ammo++;
      player.ammoTimer = 0;
    }
  } else {
    player.ammoTimer = 0;
  }

  // 발사 키
  if (keys[' '] || keys['z'] || keys['Z']) {
    fireMissile();
  }

  // 이동
  const speed = 5.5;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.vx = -speed;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) player.vx = speed;
  else player.vx *= 0.75;

  player.x += player.vx;
  player.x = Math.max(PLAYER_W / 2, Math.min(W - PLAYER_W / 2, player.x));
  if (player.invincible > 0) player.invincible--;

  // 미사일 업데이트
  missiles = missiles.filter(m => {
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 10) m.trail.shift();
    m.y += m.vy;
    if (m.y < -30) return false;

    // 미사일 vs 똥 충돌
    let hit = false;
    poops = poops.filter(p => {
      if (!hit && checkMissileHit(m, p)) {
        bigExplosion(p.x, p.y + p.size / 2);
        score += 3;
        hit = true;
        return false;
      }
      return true;
    });
    return !hit;
  });

  // 똥 업데이트
  poops = poops.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotSpeed;

    if (p.y > FLOOR + PLAYER_H / 2) {
      score++;
      burst(p.x, FLOOR + PLAYER_H / 2, '#8B6914');
      return false;
    }

    if (player.invincible === 0 && checkPlayerHit(p)) {
      lives--;
      player.invincible = 90;
      burst(player.x, player.y, '#ff4444', 24);
      if (lives <= 0) { gameOver(); return false; }
      return false;
    }
    return true;
  });

  // 파티클 업데이트
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (!p.ring) p.vy += 0.18;
    p.life -= p.decay;
    return p.life > 0;
  });

  // ─── 렌더 ───
  drawGradBg();

  if (player.invincible > 80) {
    const s = (player.invincible - 80) * 0.4;
    ctx.save();
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  poops.forEach(drawPoop);
  missiles.forEach(drawMissile);
  drawPlayer();
  drawParticles();
  drawHUD();

  if (player.invincible > 80) ctx.restore();

  requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

let touchX = null;
canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
canvas.addEventListener('touchmove', e => {
  if (touchX === null) return;
  const dx = e.touches[0].clientX - touchX;
  player.x = Math.max(PLAYER_W / 2, Math.min(W - PLAYER_W / 2, player.x + dx * 1.2));
  touchX = e.touches[0].clientX;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { touchX = null; });
</script>
</body>
</html>
