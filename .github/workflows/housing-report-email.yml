name: 주간 주택시장 동향 리포트 이메일

on:
  schedule:
    # 매주 목요일 14:00 KST (UTC 05:00) - 한국부동산원 R-ONE 신규 주차 발표 이후
    - cron: '0 5 * * 4'
    # 매주 금요일 10:00 KST (UTC 01:00) - KB부동산 신규 주차 발표 이후
    - cron: '0 1 * * 5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run housing report email script
        env:
          NAVER_APP_PASS: ${{ secrets.NAVER_APP_PASS }}
          MAIL_FROM: adneo@naver.com
          MAIL_TO: sicimi.lim@samsung.com,bh.won@samsung.com
        run: node housing-report/price-detail-email.mjs
